<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="339" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="36" fill="#0f172a" font-size="17" font-weight="700">Two independent ways to shrink a weight matrix</text>

  <!-- source matrix -->
  <rect x="40" y="120" width="150" height="120" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="115" y="170" fill="#0f172a" font-size="14" font-weight="600" text-anchor="middle">W</text>
  <text x="115" y="190" fill="#475569" font-size="11" text-anchor="middle">many numbers,</text>
  <text x="115" y="205" fill="#475569" font-size="11" text-anchor="middle">32 bits each</text>

  <!-- precision lever (top) -->
  <path d="M198 150 L300 110" stroke="#16a34a" stroke-width="2.5" fill="none" marker-end="url(#g)"/>
  <text x="250" y="108" fill="#16a34a" font-size="12" font-weight="600" text-anchor="middle">fewer bits</text>
  <rect x="312" y="66" width="620" height="96" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="330" y="92" fill="#166534" font-size="14" font-weight="700">Precision — quantize (this repo: Q8_0 / Q4_0 factors)</text>
  <text x="330" y="114" fill="#15803d" font-size="12.5">same count of numbers, fewer bits each · touches bytes &amp; memory bandwidth, not the math</text>
  <text x="330" y="134" fill="#15803d" font-size="12.5" font-weight="600">≈ free quality down to 8 bits — the strong, cheap lever</text>
  <text x="330" y="152" fill="#16a34a" font-size="11.5">e.g. 8-bit ≈ 0.27× size at ~0% quality loss</text>

  <!-- rank lever (bottom) -->
  <path d="M198 210 L300 250" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#r)"/>
  <text x="250" y="268" fill="#dc2626" font-size="12" font-weight="600" text-anchor="middle">fewer directions</text>
  <rect x="312" y="196" width="620" height="106" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="330" y="222" fill="#991b1b" font-size="14" font-weight="700">Rank — low-rank SVD (this repo's main subject)</text>
  <text x="330" y="244" fill="#b91c1c" font-size="12.5">keep only the top r "directions" of W · fewer numbers, still 32 bits</text>
  <text x="330" y="264" fill="#b91c1c" font-size="12.5" font-weight="600">expensive: discards real quality for space — the weak lever here</text>
  <text x="330" y="284" fill="#dc2626" font-size="11.5">on these small models it loses badly to quantization (see the frontier); earns its place only at extreme sizes</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#16a34a"/></marker>
    <marker id="r" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#dc2626"/></marker>
  </defs>
</svg>
