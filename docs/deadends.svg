<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="359" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="34" fill="#0f172a" font-size="17" font-weight="700">What we tried to beat plain low-rank SVD — and what the measurements said</text>

  <!-- dead ends -->
  <rect x="28" y="56" width="452" height="248" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="46" y="80" fill="#991b1b" font-size="13.5" font-weight="700">Measured out (read-only probes)</text>

  <text x="46"  y="110" fill="#dc2626" font-size="13" font-weight="700">✗ Gavish–Donoho rank threshold</text>
  <text x="64"  y="127" fill="#b91c1c" font-size="11.5">a signal+noise model; LLM weights are heavy-tailed</text>

  <text x="46"  y="153" fill="#dc2626" font-size="13" font-weight="700">✗ Residual routing / shared basis</text>
  <text x="64"  y="170" fill="#b91c1c" font-size="11.5">no free structure past good rank allocation</text>

  <text x="46"  y="196" fill="#dc2626" font-size="13" font-weight="700">✗ Frequency / wavelet / time-frequency</text>
  <text x="64"  y="213" fill="#b91c1c" font-size="11.5">weights are "white": 2D-FFT low band = 0.010 (no order)</text>

  <text x="46"  y="239" fill="#dc2626" font-size="13" font-weight="700">✗ Higher-order (ICA / dictionary / tensor / sparse)</text>
  <text x="64"  y="256" fill="#b91c1c" font-size="11.5">structure exists (U kurtosis +9) but is magnitude, not rank</text>

  <text x="46"  y="282" fill="#dc2626" font-size="13" font-weight="700">✗ Centered whitening + bias, mean routing</text>
  <text x="64"  y="299" fill="#b91c1c" font-size="11.5">whitening already absorbs the mean (helps only at rank ≤ 2)</text>

  <!-- what works -->
  <rect x="500" y="56" width="432" height="248" rx="10" fill="#f0fdf4" stroke="#86efac"/>
  <text x="518" y="80" fill="#166534" font-size="13.5" font-weight="700">What actually moves the needle</text>

  <text x="518" y="112" fill="#16a34a" font-size="13" font-weight="700">✓ Activation-aware / Fisher whitening</text>
  <text x="536" y="129" fill="#15803d" font-size="11.5">aim the unavoidable loss at low-impact directions</text>

  <text x="518" y="158" fill="#16a34a" font-size="13" font-weight="700">✓ Zero-data / hybrid calibration</text>
  <text x="536" y="175" fill="#15803d" font-size="11.5">get that metric for free (this repo's novel part)</text>

  <text x="518" y="204" fill="#16a34a" font-size="13" font-weight="700">✓ KD recovery</text>
  <text x="536" y="221" fill="#15803d" font-size="11.5">retrain the factors — the strongest quality lever</text>

  <text x="518" y="250" fill="#16a34a" font-size="13" font-weight="700">✓ Quantization (the pivot)</text>
  <text x="536" y="267" fill="#15803d" font-size="11.5">the leftover heavy-tail structure pays as BITS —</text>
  <text x="536" y="283" fill="#15803d" font-size="11.5">and beats low-rank outright (see the frontier)</text>

  <!-- principle -->
  <rect x="28" y="316" width="904" height="30" rx="8" fill="#0f172a"/>
  <text x="480" y="336" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">Principle: heavy-tailed spectra ⇒ no structural shortcut. SVD takes the 2nd-order structure; the rest is precision, not rank.</text>
</svg>
