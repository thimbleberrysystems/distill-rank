# Activation-aware, global budget rank, no finetune.
#   python -m distillrank run configs/smollm2-budget.yaml
name: smollm2-budget0.6
model:
  dir: models/SmolLM2-135M
  base_gguf: out/smollm2-135m-base-f32.gguf
method: activation_aware
rank:
  type: budget          # binary-search energy threshold to hit the param ratio
  value: 0.6
calibration:
  text: data/eval/wiki.test.raw
  seqs: 24
  seqlen: 512
  device: auto
eval:
  ppl: data/eval/wiki.micro.raw
  ctx: 256
  speed: true
